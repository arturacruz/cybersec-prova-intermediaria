<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Oceania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 260px;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #f5f5f5;
      background:
        linear-gradient(rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0.92)),
        repeating-linear-gradient(
          0deg,
          #1a1a1a 0,
          #1a1a1a 2px,
          #111 2px,
          #111 4px
        );
    }

    header {
      padding: 18px;
      text-align: center;
      background-color: #a40000;
      border-bottom: 4px solid #e00000;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 7px;
      text-transform: uppercase;
    }

    .slogan {
      margin: 7px 0 0;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    main {
      padding: 18px;
    }

    .monitoring-message {
      margin-bottom: 16px;
      color: #ff3b3b;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
    }

    .status-panel {
      padding: 14px;
      background-color: #090909;
      border: 1px solid #5c0000;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.22);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      font-size: 13px;
      text-transform: uppercase;
    }

    .status-row:last-child {
      border-bottom: none;
    }

    .status-value {
      color: #ff2c2c;
      font-weight: bold;
    }

    footer {
      padding: 10px;
      color: #777;
      font-size: 9px;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <header>
    <h1>Oceania</h1>
    <p class="slogan">Security is vigilance</p>
  </header>

  <main>
    <div class="monitoring-message">
      This page is being monitored
    </div>

    <section class="status-panel">
      <div class="status-row">
        <span>Protection</span>
        <span class="status-value">Active</span>
      </div>

      <div class="status-row">
        <span>Threats</span>
        <span class="status-value">0</span>
      </div>

      <div class="status-row">
        <span>Trackers</span>
        <span class="status-value">0</span>
      </div>

      <div class="status-row">
        <span>Risk level</span>
        <span class="status-value">Low</span>
      </div>
    </section>
  </main>

  <footer>
    Oceania observes everything
  </footer>
</body>
</html>
